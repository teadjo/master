<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Offline - Art Connection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            background: linear-gradient(145deg, #0f172a 0%, #1e1b4b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            margin: 0;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(255,255,240,0.03) 0%, rgba(0,0,0,0) 70%);
            pointer-events: none;
            z-index: 0;
        }

        .offline-card {
            position: relative;
            z-index: 2;
            max-width: 520px;
            width: 100%;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(8px);  
            -webkit-backdrop-filter: blur(8px);
            border-radius: 2.5rem;
            padding: 2.2rem 1.8rem 2.5rem;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.08) inset;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-align: center;
            color: #f8fafc;
        }

        .offline-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 30px 50px -15px rgba(0, 0, 0, 0.5);
        }

        .icon-wrapper {
            font-size: 5rem;
            margin-bottom: 1rem;
            display: inline-block;
            filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.2));
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff, #c7d2fe);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.75rem;
        }

        .description {
            font-size: 1.05rem;
            line-height: 1.5;
            color: #e2e8f0;
            margin: 1rem 0 0.8rem;
            font-weight: 450;
        }

        .secondary-text {
            font-size: 0.9rem;
            color: #a5b4fc;
            margin-bottom: 2rem;
            border-left: 2px solid rgba(165, 180, 252, 0.5);
            padding-left: 0.75rem;
            display: inline-block;
        }

        .retry-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            background: white;
            color: #1e1b4b;
            border: none;
            padding: 0.9rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            border-radius: 3rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-top: 0.5rem;
            background: #f8fafc;
        }

        .retry-btn:hover {
            transform: scale(1.02);
            background: #ffffff;
            box-shadow: 0 12px 22px -8px rgba(0, 0, 0, 0.25);
        }

        .retry-btn:active {
            transform: scale(0.98);
            transition: 0.05s;
        }


        @keyframes pulse {
            0% { opacity: 0.4; transform: scale(0.8);}
            50% { opacity: 1; transform: scale(1.2);}
            100% { opacity: 0.7; transform: scale(1);}
        }

        @media (max-width: 480px) {
            .offline-card {
                padding: 1.8rem 1.2rem 2rem;
                border-radius: 2rem;
            }
            h1 {
                font-size: 1.9rem;
            }
            .icon-wrapper {
                font-size: 4rem;
            }
            .retry-btn {
                padding: 0.75rem 1.6rem;
                font-size: 0.9rem;
            }
        }

        button:focus-visible {
            outline: 3px solid #c084fc;
            outline-offset: 3px;
        }

        .offline-hint {
            font-size: 0.75rem;
            margin-top: 1.8rem;
            color: #94a3b8;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="offline-card" role="main" aria-labelledby="offline-title">
        

        <div class="icon-wrapper">
            📡
        </div>
        
        <h1 id="offline-title">Izvan mreže</h1>
        
        <p class="description">
            Izgleda da ste trenutno <strong>offline</strong>.<br>
            Art Connection treba internet da bi prikazao svježe sadržaje.
        </p>
        
        <div class="secondary-text">
            Proverite Wi-Fi ili mobilne podatke
        </div>
        <br>
        <button class="retry-btn" id="reloadButton" aria-label="Pokušaj ponovo povezivanje">
            <span>⟳</span> Pokušaj ponovo
        </button>
        
        <div class="offline-hint">
            🎨 Čim se vrati konekcija, osvježite stranicu
        </div>
    </div>

    <script>
        (function() {
            "use strict";

            const reloadBtn = document.getElementById('reloadButton');
            
            window.addEventListener('online', () => {
                setTimeout(() => {
                    window.location.reload()
                }, 1500)
                })
            function forceReload() {
                window.location.reload();
            }
            
            

            let onlineNotificationElement = null;
            
            function showOnlineHint() {
                if (!navigator.onLine) return;
                if (document.getElementById('dynamicOnlineHint')) return;
                if (onlineNotificationElement) return;
                
                const hintDiv = document.createElement('div');
                hintDiv.id = 'dynamicOnlineHint';
                hintDiv.style.marginTop = '1rem';
                hintDiv.style.fontSize = '0.85rem';
                hintDiv.style.background = 'rgba(74, 222, 128, 0.2)';
                hintDiv.style.padding = '0.5rem 1rem';
                hintDiv.style.borderRadius = '2rem';
                hintDiv.style.backdropFilter = 'blur(4px)';
                hintDiv.style.border = '1px solid rgba(74, 222, 128, 0.5)';
                hintDiv.style.display = 'inline-block';
                hintDiv.style.width = 'auto';
                hintDiv.innerHTML = '✅ Internet se vratio! <strong>Kliknite dugme</strong> za osvežavanje.';
                
                const card = document.querySelector('.offline-card');
                if (card && !document.getElementById('dynamicOnlineHint')) {
                    const btnParent = reloadBtn.parentNode;
                    const hintContainer = document.querySelector('.offline-hint');
                    if (hintContainer) {
                        card.insertBefore(hintDiv, hintContainer);
                    } else {
                        card.appendChild(hintDiv);
                    }
                    onlineNotificationElement = hintDiv;                    
                }
            }
            
            function removeOnlineHint() {
                const existing = document.getElementById('dynamicOnlineHint');
                if (existing) existing.remove();
                onlineNotificationElement = null;
            }
            
            function handleNetworkChange() {
                if (navigator.onLine) {
                    showOnlineHint();
                } else {
                    removeOnlineHint();
                }
            }
            
            updateNetworkStatusUI();
            
            if (navigator.onLine) {
                showOnlineHint();
            } else {
                removeOnlineHint();
            }
            
            window.addEventListener('online', handleNetworkChange);
            window.addEventListener('offline', handleNetworkChange);
            
            if (reloadBtn) {
                reloadBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    forceReload();
                });
            }
            window.addEventListener('pageshow', function(event) {
                updateNetworkStatusUI();
                if (navigator.onLine) {
                    showOnlineHint();
                } else {
                    removeOnlineHint();
                }
            });
            
            const observer = new MutationObserver(() => {
                if (!navigator.onLine && document.getElementById('dynamicOnlineHint')) {
                    removeOnlineHint();
                }
            });
            observer.observe(document.body, { childList: true, subtree: false });

        })();
    </script>
</body>
</html>
